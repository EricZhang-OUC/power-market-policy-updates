name: Bootstrap source
on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/source.zip"
      - ".github/workflows/bootstrap.yml"
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source archive
        shell: bash
        run: |
          rm -rf /tmp/policy-source
          mkdir -p /tmp/policy-source
          unzip -q .bootstrap/source.zip -d /tmp/policy-source
          rm -rf /tmp/policy-source/.github/workflows
          cp -a /tmp/policy-source/. .
      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Initial release of power market policy updates"
            git push
          fi
