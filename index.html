<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电力市场政策动态 · 最新政策</title>
<link rel="stylesheet" href="styles.css">
<aside><h2>电力市场政策动态</h2><small>Power market policy updates</small><nav id="nav"></nav></aside><main><header><div><h1 id="title">国家政策动态</h1><p id="desc">聚焦国家与山东，让每一项规则都有来源。</p></div><span id="updated" class="meta"></span></header><div id="sync-status" class="meta" style="margin-top:16px"></div><div id="content"></div><footer>政策动态持续归集 · 文件内容及适用情况以官方原文为准</footer></main>
<script src="data/policies.js"></script>
<script src="data/weather.js"></script>
<script src="data/regions.js"></script>
<script src="data/media.js"></script>
<script src="recent-updates.js"></script>
<script src="weather-ui.js"></script>
<script src="regions-ui.js"></script>
<script src="media-ui.js"></script>
<script>
const tabs=['国家政策动态','山东政策动态','气象数据','其他省区','行业观察'];let current='国家政策动态';
const dataset=window.POLICY_DATA||{rows:[],sources:[]};const rows=dataset.rows;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(r,highlightRecent=true){const recent=highlightRecent&&window.RecentUpdates?.isRecent(r.date);return '<article class="item'+(recent?' item-recent':'')+'"><div class="meta"><span>'+esc(r.agency)+'</span>'+(recent?window.RecentUpdates.badge:'')+'</div><a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">'+esc(r.title)+'</a>'+(r.note?'<p>'+esc(r.note)+'</p>':'')+'<div class="item-bottom"><span>'+esc(r.region)+(r.detailStatus==='index-only'?' · 仅取得官方目录信息':'')+(r.attachments?.length?' · '+r.attachments.length+' 个附件':'')+'</span><span>'+esc(r.linkLabel||'查看官方原文 ↗')+'</span></div>'+(r.otherSources?.length?'<details class="other-sources"><summary>另有 '+r.otherSources.length+' 个官方出处</summary>'+r.otherSources.map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.agency)+' · '+esc(s.date)+' ↗</a>').join('')+'</details>':'')+'</article>'}
function feed(data,{highlightRecent=true}={}){if(!data.length)return '<div class="empty">暂无记录。</div>';const groups=new Map();for(const r of [...data].sort((a,b)=>b.date.localeCompare(a.date))){if(!groups.has(r.date))groups.set(r.date,[]);groups.get(r.date).push(r)}return '<div class="timeline">'+[...groups].map(([date,items])=>{const [year,month,day]=date.split('-');const weekday=new Intl.DateTimeFormat('zh-CN',{weekday:'long',timeZone:'Asia/Shanghai'}).format(new Date(date+'T12:00:00+08:00'));return '<section class="day-group" aria-label="'+date+'"><div class="day-heading'+(highlightRecent&&window.RecentUpdates?.isRecent(date)?' recent-day':'')+'"><time class="day-primary" datetime="'+date+'">'+Number(month)+'月'+Number(day)+'日</time><span class="day-secondary">'+year+'年 · '+weekday+' · '+items.length+' 条</span></div><div class="day-items">'+items.map(r=>card(r,highlightRecent)).join('')+'</div></section>'}).join('')+'</div>'}
function navigate(t){current=t;document.querySelector('#updated').textContent=dataset.updatedAt?'政策更新于 '+new Date(dataset.updatedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'';document.querySelector('#sync-status').textContent='历史范围：2022年至今。'+(dataset.sources.some(s=>s.status!=='ok')?'部分来源读取不完整，保留可用记录。':'');document.querySelector('#title').textContent=t;document.querySelector('#desc').textContent=['国家政策动态','山东政策动态'].includes(t)?'官方政策按发布时间排列，最新发布在前。':'聚焦国家与山东，让每一项规则都有来源。';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent===t));render()}
function render(){if(current==='行业观察'){window.renderMedia(current);return}if(current==='其他省区'){window.renderRegions();return}if(current==='气象数据'){window.renderWeather();return}let e=document.querySelector('#content');if(['国家政策动态','山东政策动态'].includes(current)){const region=current==='国家政策动态'?'国家':'山东';const dataRows=rows.filter(r=>r.region===region&&r.date>='2022-01-01');const years=[...new Set(dataRows.map(r=>r.date.slice(0,4)))].sort().reverse();e.innerHTML='<div class="filter-bar"><div class="feed-switch"><button class="'+(region==='国家'?'selected':'')+'" onclick="navigate(&quot;国家政策动态&quot;)">国家</button><button class="'+(region==='山东'?'selected':'')+'" onclick="navigate(&quot;山东政策动态&quot;)">山东</button></div><div class="toolbar"><input aria-label="搜索政策" id="q" placeholder="搜索政策标题、发布机构…"><select aria-label="年份" id="year"><option value="">全部年份</option>'+years.map(y=>'<option value="'+y+'">'+y+'年</option>').join('')+'</select></div></div><p id="count" class="meta"></p><div id="results"></div>';function filter(){const q=document.querySelector('#q').value.toLowerCase(),year=document.querySelector('#year').value;const data=dataRows.filter(r=>(!year||r.date.startsWith(year))&&(r.title+r.agency+(r.otherSources||[]).map(s=>s.title+s.agency).join('')).toLowerCase().includes(q));document.querySelector('#results').innerHTML=feed(data);document.querySelector('#count').textContent='已收录 '+data.length+' 条 · 历史范围：2022年至今（持续补录）'}document.querySelector('#q').oninput=filter;document.querySelector('#year').onchange=filter;filter();return}
e.innerHTML='<div class="empty">暂无记录。</div>'}
document.querySelector('#updated').textContent=dataset.updatedAt?'更新于 '+new Date(dataset.updatedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'';
document.querySelector('#sync-status').textContent='历史范围：2022年至今 · 持续补录。'+(dataset.sources.some(s=>s.status!=='ok')?' 部分来源读取不完整，已保留可用记录。':'');
function navIcon(index){const paths=['<path d="M4 20h16M6 20V8h12v12M9 11h1m4 0h1M9 14h1m4 0h1M10 20v-3h4v3M4 8l8-5 8 5"/>','<path d="M18 10c0 5-6 10-6 10S6 15 6 10a6 6 0 1 1 12 0Z"/><circle cx="12" cy="10" r="2"/>','<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>','<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/>','<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>','<path d="m3 7 9-4 9 4-9 4-9-4Zm0 5 9 4 9-4M3 17l9 4 9-4"/>'];return '<span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+paths[index]+'</svg></span>'}
document.querySelector('#nav').innerHTML=tabs.map((t,i)=>(i===0?'<div class="nav-section">政策动态</div>':i===2?'<div class="nav-section">更多关注</div>':'')+'<button onclick="navigate(&quot;'+t+'&quot;)">'+navIcon(i)+'<span>'+t+'</span></button>').join('');navigate('国家政策动态');
</script></html>
